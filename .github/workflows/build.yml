name: Build Fog Z VST3 (Windows + macOS)
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-Windows
          # wildcard: works whatever the CMake target is called
          path: build/*_artefacts/Release/VST3/

  macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build (universal arm64 + x86_64)
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Find, sign and package the plug-in
        shell: bash
        run: |
          set -e
          VST="$(find build -type d -name '*.vst3' -path '*Release/VST3/*' | head -n 1)"
          if [ -z "$VST" ]; then echo "No .vst3 found"; find build -name '*.vst3'; exit 1; fi
          echo "Found: $VST"
          mkdir -p dist
          cp -R "$VST" dist/
          NAME="$(basename "$VST")"
          codesign --force --deep --sign - "dist/$NAME"
          lipo -info "dist/$NAME/Contents/MacOS/"* || true
          cat > "dist/INSTALL macOS.txt" <<TXT
          1. Copy "$NAME" to  ~/Library/Audio/Plug-Ins/VST3/   (or /Library/Audio/Plug-Ins/VST3/)
          2. Open Terminal and run once:
                xattr -cr ~/Library/Audio/Plug-Ins/VST3/"$NAME"
             (removes the "downloaded from the internet" quarantine flag)
          3. Re-scan plug-ins in Reaper (Options > Preferences > Plug-ins > VST > Re-scan).
          TXT
          ls -la dist
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-macOS
          path: dist/

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/FogZ-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FogZ-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: FogZ-VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "FogZ-VST3-Windows.zip" ""
          pack dist/mac "FogZ-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="FogZ-VST3-Windows.zip FogZ-VST3-macOS.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Fog Z $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
